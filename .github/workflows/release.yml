name: Release

# Push a tag like v1.0.0 → builds the DMG and publishes it as a GitHub Release.
# Run manually (Actions tab → Release → Run workflow) to just build the DMG as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          BUILD_DIR="$RUNNER_TEMP/build" ./make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "Markdown Viewer ${GITHUB_REF_NAME#v}" --generate-notes
